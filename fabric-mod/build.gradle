plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "bayonclient" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.register('prepareLauncherBundle', Copy) {
    dependsOn tasks.named('build')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(layout.projectDirectory.dir('dist'))
    rename { 'bayonclient.jar' }
    doLast {
        file('dist/bayonclient.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                version: project.version.toString(),
                minecraftVersion: project.minecraft_version.toString(),
                loader: 'Fabric'
        ]))
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
