<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bayon Store Admin</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090c10;color:#f5f7fa;font:15px system-ui,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:42px auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.muted{color:#91a0b0}.panel,.item{background:#111820;border:1px solid #263442;border-radius:15px;padding:22px;margin-bottom:15px}h1{font-size:26px}h2{font-size:19px;margin:0 0 16px}label{display:grid;gap:7px;color:#aebccc;font-size:13px}input,textarea{font:inherit;background:#0b1016;color:white;border:1px solid #344352;border-radius:9px;padding:11px;width:100%}textarea{min-height:85px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.span{grid-column:1/-1}button{background:#192633;color:white;border:1px solid #3c5265;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}button:hover{border-color:#72c8ff}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}.notice{padding:11px;background:#19232e;color:#a8dfff;border-radius:8px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{margin:0}.item model-viewer{width:100%;height:160px;background:#0a0f14;border-radius:10px;margin:12px 0}.danger{border-color:#763e3e}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.span{grid-column:auto}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><h1>Bayon Store Admin</h1><span class="muted">Cosmetics catalog and 3D assets</span></div><button id="logout" class="hidden">Sign out</button></header>
  <section id="login" class="panel"><h2>Admin sign-in</h2><p class="muted">Enter the private BACOIN_ADMIN_KEY configured on the server.</p><form id="loginForm"><label>Admin key<input id="secret" type="password" autocomplete="current-password" required></label><div class="actions"><button>Sign in</button></div></form></section>
  <div id="admin" class="hidden">
    <section class="panel"><h2>Generate Bacoins redeem codes</h2><p class="muted">Codes are shown once. Save them securely before closing this page.</p><form id="codesForm" class="grid"><label>Bacoins per code<input id="codeAmount" type="number" min="1" max="1000000" value="500" required></label><label>Number of codes<input id="codeCount" type="number" min="1" max="100" value="1" required></label><label>Maximum claims per code<input id="maxClaims" type="number" min="1" max="10000" value="1" required></label><div class="actions"><button>Generate codes</button></div></form><pre id="generatedCodes" class="notice hidden" style="white-space:pre-wrap;user-select:text"></pre></section>
    <section class="panel"><h2 id="formTitle">Add cosmetic</h2><form id="productForm" class="grid"><label>ID (lowercase, use dashes)<input id="id" pattern="[a-z0-9][a-z0-9-]{1,48}" required></label><label>Name<input id="name" maxlength="60" required></label><label class="span">Description<textarea id="description" maxlength="300"></textarea></label><label>Category<input id="category" maxlength="40" value="Profile cosmetic"></label><label>Bacoins price<input id="price" type="number" min="0" max="1000000" value="500" required></label><label>Accent color<input id="accent" type="color" value="#72c8ff"></label><label class="span">3D model (.glb)<input id="model" type="file" accept=".glb,model/gltf-binary"><small>Optional. GLB model files up to 12 MB are supported.</small></label><label class="span">Model URL<input id="modelUrl" placeholder="Upload a GLB or paste /media/cosmetics/... URL"></label><div class="actions span"><button id="save">Save cosmetic</button><button id="reset" type="button">Clear form</button></div></form><div id="message" class="notice hidden"></div></section>
    <section class="panel"><div class="row"><h2>Cosmetics</h2><button id="refresh">Refresh</button></div><div class="items" id="items"></div></section>
  </div>
</main>
<script>
const API=location.origin;let adminToken=sessionStorage.getItem('bayon-admin-token')||'';const $=(id)=>document.getElementById(id);
async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(adminToken?{Authorization:`Bearer ${adminToken}`}:{}) ,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMessage(text){$('message').textContent=text;$('message').classList.remove('hidden')}
function updateState(){const signed=Boolean(adminToken);$('login').classList.toggle('hidden',signed);$('admin').classList.toggle('hidden',!signed);$('logout').classList.toggle('hidden',!signed);if(signed)load()}
async function load(){try{const data=await api('/api/admin/cosmetics');$('items').innerHTML='';for(const item of data.cosmetics){const node=document.createElement('article');node.className='item';node.innerHTML=`<div class="row"><strong>${escapeHtml(item.name)}</strong><small class="muted">${Number(item.price).toLocaleString()} Bacoins</small></div>${item.modelUrl?`<model-viewer src="${escapeHtml(item.modelUrl)}" camera-controls auto-rotate></model-viewer>`:''}<p class="muted">${escapeHtml(item.description)}</p><div class="actions"><button data-edit="${escapeHtml(item.id)}">Edit</button><button class="danger" data-delete="${escapeHtml(item.id)}">Delete</button></div>`;$('items').append(node)}$('items').querySelectorAll('[data-edit]').forEach((button)=>button.onclick=()=>edit(data.cosmetics.find((item)=>item.id===button.dataset.edit)));$('items').querySelectorAll('[data-delete]').forEach((button)=>button.onclick=async()=>{if(!confirm('Delete this cosmetic from the catalog?'))return;try{await api(`/api/admin/cosmetics/${encodeURIComponent(button.dataset.delete)}`,{method:'DELETE'});load()}catch(error){setMessage(error.message)}})}catch(error){setMessage(error.message)}}
function edit(item){$('formTitle').textContent='Edit cosmetic';for(const key of ['id','name','description','category','price','accent','modelUrl'])$(key).value=item[key]??'';$('id').disabled=true;window.scrollTo({top:0,behavior:'smooth'})}
function reset(){ $('productForm').reset();$('id').disabled=false;$('formTitle').textContent='Add cosmetic';$('accent').value='#72c8ff';$('price').value='500';$('category').value='Profile cosmetic'}
async function upload(file){if(!file)return '';if(file.size>12*1024*1024)throw new Error('Files must be under 12 MB.');const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const result=await api('/api/admin/assets',{method:'POST',body:JSON.stringify({fileName:file.name,mimeType:'model/gltf-binary',base64})});return result.url}
$('loginForm').onsubmit=async(event)=>{event.preventDefault();try{const result=await api('/api/admin/session',{method:'POST',body:JSON.stringify({secret:$('secret').value})});adminToken=result.token;sessionStorage.setItem('bayon-admin-token',adminToken);updateState()}catch(error){alert(error.message)}};
$('logout').onclick=()=>{adminToken='';sessionStorage.removeItem('bayon-admin-token');updateState()};$('refresh').onclick=load;$('reset').onclick=reset;
$('codesForm').onsubmit=async(event)=>{event.preventDefault();const output=$('generatedCodes');output.classList.remove('hidden');output.textContent='Generating…';try{const result=await api('/api/admin/redeem-codes',{method:'POST',body:JSON.stringify({amount:Number($('codeAmount').value),count:Number($('codeCount').value),maxClaims:Number($('maxClaims').value)})});output.textContent=result.codes.join('\n');}catch(error){output.textContent=error.message}};
$('productForm').onsubmit=async(event)=>{event.preventDefault();const button=$('save');button.disabled=true;try{let modelUrl=$('modelUrl').value.trim();if($('model').files[0])modelUrl=await upload($('model').files[0]);const body={id:$('id').value.trim(),name:$('name').value.trim(),description:$('description').value.trim(),category:$('category').value.trim(),price:Number($('price').value),accent:$('accent').value,modelUrl,active:true};await api('/api/admin/cosmetics',{method:'PUT',body:JSON.stringify(body)});setMessage('Cosmetic saved. It is visible in the web store and Bayon Client.');reset();load()}catch(error){setMessage(error.message)}finally{button.disabled=false}};
updateState();
</script></body></html>
