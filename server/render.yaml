services:
  - type: web
    name: bayon-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: BACOIN_ADMIN_KEY
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BACOIN_EMAIL_FROM
        sync: false

